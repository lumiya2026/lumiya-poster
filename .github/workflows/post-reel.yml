name: 하루 1번 릴스 게시

# 2026-10-18 신설, 같은 날 시각 변경(사용자 요청) — 카드뉴스(post.yml, 하루 3번)와
# 별도 스케줄이다. 릴스는 그날 ②漢字チェーン 카드뉴스와 같은 한자를 쓰고
# (03_KDK generate.ts), **하루 중 가장 먼저** 올라가야 한다는 요청에 따라 카드뉴스
# 첫 슬롯(07:30 JST)보다 30분 이른 **07:00 JST**로 잡았다 — 릴스로 유입된 사람이
# 그날 카드뉴스를 이어서 보게 하는 순서다(처음엔 19:30 직후인 21:00 JST로 뒀었는데,
# "릴스를 제일 먼저 올리고 카드뉴스가 뒤따르게" 해 달라는 요청으로 아침으로 옮겼다).
# 2026-11-12 사용자 요청으로 하루 두 번(10:30 · 13:30 JST)으로 바꿨다 — 그동안 릴스를 거의 못 올려 밀린 것을 빼는 중이다.
# 큐가 비면 그 회차는 아무것도 안 하고 끝난다(post-reel.ts). GitHub 의 schedule 은 수 분~수십 분 늦게 돌 수 있다.
on:
  schedule:
    - cron: '30 1 * * *' # 10:30 JST
    - cron: '30 4 * * *' # 13:30 JST
  workflow_dispatch: {} # 수동으로도 돈다

permissions:
  contents: write # reel-queue/ → posted-reels/ 이동을 커밋·푸시하려면 필요

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 릴스 큐의 다음 항목 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run post-reel

      - name: reel-queue → posted-reels 이동을 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 릴스 게시 완료 항목을 posted-reels/ 로 이동"
          git push
