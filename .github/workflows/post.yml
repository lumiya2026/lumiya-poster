name: 하루 3번 카드뉴스 게시

# 일본 시간(JST) 기준 07:30(출근길)·12:30(점심)·19:30(저녁) 대략적인 배치.
# 하루 6번에서 3번으로 줄인 이유: 인스타그램 피드는 하루 1~3회가 보통 권장 범위다 —
# 그 이상은 팔로워 피로·언팔로우로 이어지기 쉽고, 새 게시물이 너무 빨리 이어지면
# 직전 게시물의 도달(reach)까지 스스로 깎아먹는다(docs/cardnews-rules.md 참조).
# GitHub Actions 스케줄은 부하가 몰리면 몇 분 늦게 뜰 수 있다(공식 문서에 명시된 동작) —
# 정시에 정확히 맞춰야 할 이유가 없는 광고라 문제 삼지 않는다.
# 스케줄은 **일부러 꺼 뒀다.** 카드뉴스 디자인·콘텐츠가 아직 준비 중이라,
# 켜 두면 사람이 보지 않는 사이에 미완성 광고가 실계정(@kantsuna.lumiya)에
# 하루 3장씩 나간다 — 한 번 나간 게시물은 API 로 못 지우고 손으로 지워야 한다.
# 준비가 끝나면 아래 schedule 블록의 주석을 풀면 그대로 되살아난다.
# 그때까지도 workflow_dispatch 는 남겨 둔다 — 토큰·IG_USER_ID 가 맞는지
# 확인하려면 수동으로 한 장은 올려 봐야 하기 때문이다.
on:
  # schedule:
  #   - cron: '30 22 * * *' # 07:30 JST
  #   - cron: '30 3 * * *'  # 12:30 JST
  #   - cron: '30 10 * * *' # 19:30 JST
  workflow_dispatch: {} # 수동으로만 돈다

permissions:
  contents: write # queue/ → posted/ 이동을 커밋·푸시하려면 필요

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 큐의 다음 항목 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run post

      - name: queue → posted 이동을 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 게시 완료 항목을 posted/ 로 이동"
          git push
